<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Limpiador de Reportes PDF</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    textarea { width: 100%; max-width: 600px; margin-bottom: 10px; }
    button { padding: 10px 15px; cursor: pointer; background: #0066cc; color: white; border: none; border-radius: 4px;}
  </style>
</head>
<body>
  <h3>Limpiador de Reportes PDF</h3>
  <textarea id="texto" rows="15" placeholder="Pega aquí el texto vertical del PDF..."></textarea>
  <br>
  <button onclick="limpiarYCopiar()">1. Limpiar y Copiar automáticamente</button>

  <script>
    function limpiarYCopiar() {
      let caja = document.getElementById('texto');
      // Reemplaza los saltos de línea por espacios
      let textoLimpio = caja.value.replace(/[\r\n]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
      caja.value = textoLimpio;
      
      // Copia el texto limpio al portapapeles
      navigator.clipboard.writeText(textoLimpio).then(() => {
        alert("¡Listo! El texto está limpio y copiado. Ya puedes ir al expediente del hospital y pegarlo (Ctrl+V).");
      });
    }
  </script>
</body>
</html>
